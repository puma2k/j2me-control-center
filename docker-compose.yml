services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    image: j2me-control-center:local
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      EMULATOR_DIR: /emulator
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (12+ characters)}
      MAX_INSTANCES: ${MAX_INSTANCES:-5}
      MEMORY_BUDGET_MB: ${MEMORY_BUDGET_MB:-2048}
      START_TIMEOUT_SECONDS: ${START_TIMEOUT_SECONDS:-60}
      STREAM_FPS: ${STREAM_FPS:-60}
      STREAM_QUALITY: ${STREAM_QUALITY:-60}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    volumes:
      - games:/data/games
      - state:/data/state
      - metadata:/data
    mem_limit: ${CONTAINER_MEMORY:-3g}
    cpus: ${CONTAINER_CPUS:-2.0}
    pids_limit: 1024
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  games:
  state:
  metadata:
